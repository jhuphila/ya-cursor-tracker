version: 1
default_policy: keep_with_unknown
ambiguous_policy: highest_priority
emit_resolution_trace: true

repo_aliases:
  myorg/myrepo:
    - "git@github.com:myorg/myrepo.git"
    - "https://github.com/myorg/myrepo"

path_mappings:
  - id: sshHomeMap
    remote_prefix: "/home/ubuntu/work/"
    repo_key_from_segment_index: 1
    priority: 80

workspace_hints:
  "workspace-uuid-or-name": "myorg/myrepo"

manual_overrides:
  "00000000-0000-0000-0000-000000000000": "myorg/myrepo"

ignore_paths:
  - "/tmp/"
