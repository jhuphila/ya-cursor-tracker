# Copy to config/tracker_config.yaml and adjust paths.
# Paths are relative to this file's directory unless absolute.

output_dir: ../cursor-exports
interactions_csv: interactions.csv
sample_csv: interactions_sample.csv
sample_head_rows: 50
sample_tail_rows: 0
checkpoint_db: interactions_checkpoint.sqlite3

# Optional: limit bubble-derived interactions (ms epoch). Usually omit for full history.
# since_timestamp_ms: null

# Override when Cursor stores data elsewhere (SSH / portable installs):
# state_vscdb: null
# workspace_storage: null
# ai_tracking_db: null

# Optional YAML rules (copy attribution_rules.example.yaml and point here):
# attribution_rules_path: ./attribution_rules.yaml

# Optional: Cursor dashboard Usage → Export CSV (adds a Cost column to interactions.csv).
# Point at a directory, a glob, or a specific file. Multiple usage-events* files → newest
# by filename date (usage-events-2026-07-13 beats usage-events-2026-07-12).
# usage_events_csv: ..
# usage_events_csv: ../usage-events*.csv
# usage_match_tolerance_ms: 30000
